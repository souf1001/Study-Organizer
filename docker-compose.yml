# Web-Version mit automatischem HTTPS über Caddy.
# 1. .env aus .env.example anlegen und ausfüllen (DOMAIN, SECRET_KEY)
# 2. docker compose up -d
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TRUST_PROXY: 'true'
      COOKIE_SECURE: 'true'
    volumes:
      - study-data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    command: caddy reverse-proxy --from ${DOMAIN} --to app:3000
    volumes:
      - caddy-data:/data
    depends_on:
      - app

volumes:
  study-data:
  caddy-data:
