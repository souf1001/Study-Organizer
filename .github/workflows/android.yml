# Builds the Android APK.
# - Every push to mobile-android: the APK is available under "Actions → run → Artifacts".
# - A tag like v0.3.0 additionally attaches the APK to the GitHub release of that tag.
# - Started by hand with a release tag, it creates that tag and release for the chosen branch.
name: Android APK

on:
  push:
    branches: [mobile-android]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach the APK to a release with this tag (e.g. v0.3.0); leave empty for a plain build'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.release_tag || github.ref_name }}
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Build web app and copy it into the Android project
        run: npm run build:android
      - name: Build signed release APK
        run: node scripts/build-android.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Study-Organizer-Android
          path: release/*.apk
          if-no-files-found: error
      - name: Attach to release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: release/*.apk
          prerelease: ${{ contains(env.TAG, '-') }}
          make_latest: ${{ !contains(env.TAG, '-') }}
