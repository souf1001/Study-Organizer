# Builds the installer packages on real Windows, macOS and Linux runners.
# - On every push the files are available for download under "Actions -> run -> Artifacts".
# - For a tag like v0.1.0 a GitHub release with all files is created as well.
# - Started by hand with a release tag, it creates that tag and release for the chosen branch.
name: Installer packages

on:
  push:
    branches: [main, webapp, 'feature/**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a release with this tag (e.g. v0.3.0); leave empty for a plain build'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            files: release/*.exe
          - os: macos-latest
            target: --mac
            files: release/*.dmg
          - os: ubuntu-latest
            target: --linux
            files: release/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build package
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # Without our own certificate, do not search for a signing identity
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: Study-Organizer-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(env.TAG, '-') }}
          make_latest: ${{ !contains(env.TAG, '-') }}
