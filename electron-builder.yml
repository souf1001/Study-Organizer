# Installer packages: Windows (.exe), macOS (.dmg), Linux (.AppImage)
appId: de.studyorganizer.app
productName: Study Organizer
copyright: Copyright © 2026 Soufian Kroud
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asar: true

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  artifactName: Study-Organizer-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Study Organizer

mac:
  category: public.app-category.education
  icon: build/icon.png
  target:
    - target: dmg
      arch: [universal]
  artifactName: Study-Organizer-${version}-mac.${ext}
  # Ad-hoc signature: works without an Apple developer account (first launch needs "Open Anyway").
  # With a certificate: remove identity and set CSC_LINK/CSC_KEY_PASSWORD.
  identity: '-'
  hardenedRuntime: false

dmg:
  title: Study Organizer ${version}

linux:
  target: [AppImage]
  category: Education
  icon: build/icon.png
  artifactName: Study-Organizer-${version}.${ext}
