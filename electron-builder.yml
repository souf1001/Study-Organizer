appId: de.studyorganizer.app
productName: Study Organizer
copyright: Copyright © 2026 Soufian Kroud
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asar: true

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: Study-Organizer-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Study Organizer

mac:
  category: public.app-category.education
  target:
    - target: dmg
      arch: [universal]
  artifactName: Study-Organizer-${version}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false

dmg:
  title: Study Organizer ${version}

linux:
  target: [AppImage]
  category: Education
  artifactName: Study-Organizer-${version}.${ext}
